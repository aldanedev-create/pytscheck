name: Refresh compiler manifest

# Manual one-shot: downloads/builds all nine pinned compilers with the pinned Go
# toolchain, regenerates src/pytscheck/bin/manifest.json and the per-platform
# metadata, stops tracking the compiler executables (they are build artifacts),
# and commits the result to the branch this workflow was run on.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: false
      - name: Build every platform and regenerate the manifest
        run: |
          python scripts/build_binaries.py
          python scripts/verify_binaries.py
          python scripts/generate_manifest.py --check
      - name: Stop tracking compiler executables and commit metadata
        run: |
          git rm -r -q --cached --ignore-unmatch \
            'src/pytscheck/bin/*/lib/tsc' 'src/pytscheck/bin/*/lib/tsc.exe' \
            'src/pytscheck/bin/*/lib/tsc.sig' 'src/pytscheck/bin/*/lib/tsgo' 'src/pytscheck/bin/*/lib/tsgo.exe'
          git add src/pytscheck/bin/manifest.json
          git add -f src/pytscheck/bin/*/package.json src/pytscheck/bin/*/LICENSE \
            src/pytscheck/bin/*/NOTICE.txt src/pytscheck/bin/*/README.md
          git status --short
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh compiler manifest for TypeScript 7.0.2"
          git push
