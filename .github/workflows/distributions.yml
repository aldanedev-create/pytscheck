name: Build PyPI distributions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, linux-arm64, win32-x64, win32-arm64, darwin-x64, darwin-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - name: Download and verify pinned compiler
        run: |
          python scripts/build_binaries.py "${{ matrix.platform }}"
          python scripts/verify_binaries.py
          python scripts/generate_manifest.py --check
      - name: Build platform wheel
        env:
          PYTSCHECK_BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m build --wheel
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: compiler-${{ matrix.platform }}
          path: src/pytscheck/bin/
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build twine
      - run: |
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
