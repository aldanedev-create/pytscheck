name: Bug report
description: Something isn't working as expected.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the fields below.
        For security issues, use the private reporting channel described
        in SECURITY.md instead of opening an issue.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and discussions for this bug.
          required: true
        - label: I am running the latest version of pytscheck.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: |
        The smallest TypeScript source and smallest Python snippet that
        reproduces the problem. If the bug is compiler-output-related,
        include the raw output too.
      render: python
    validations:
      required: true

  - type: input
    id: pytscheck-version
    attributes:
      label: pytscheck version
      description: Output of `python -c "import pytscheck; print(pytscheck.__version__)"`.
    validations:
      required: true

  - type: input
    id: compiler-version
    attributes:
      label: Bundled compiler version
      description: |
        Output of `python -m pytscheck --version`, or
        `result.compiler_version` from the failing call.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x86-64)
        - Linux (ARM64)
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows (x86-64)
        - Windows (ARM64)
        - Other
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback or diagnostic output
      description: Paste any traceback or pytscheck output verbatim.
      render: text
    validations:
      required: false