name: Feature request
description: Suggest an idea or improvement.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before filing, please check the
        non-goals in the README -- pytscheck is deliberately narrow.

  - type: checkboxes
    id: prereqs
    attributes:
      label: Prerequisites
      options:
        - label: This is not a request to implement a TypeScript type system.
          required: true
        - label: This is not a request to bundle an additional compiler.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like pytscheck to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Public Python API
        - Adapter protocol
        - Bundled compiler
        - CLI
        - Packaging / distribution
        - Documentation
        - Other
    validations:
      required: true