[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pytscheck"
version = "0.1.0.dev0"
description = "Python-native TypeScript type checking, powered by a bundled native tsgo compiler."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "PyTSCheck contributors" }]
keywords = ["typescript", "type-checking", "tsgo", "compiler", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []  # stdlib only

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis",
    "ruff",
    "mypy",
    "build",
    "hatchling",
    "pip-audit",
    "check-wheel-contents",
]

[project.urls]
Homepage = "https://github.com/your-org/pytscheck"
Repository = "https://github.com/your-org/pytscheck"
Documentation = "https://pytscheck.readthedocs.io/"

[project.entry-points."pytscheck.adapters"]
# Third-party tools register here. Intentionally empty in core.

[tool.hatch.build.targets.wheel]
packages = ["src/pytscheck"]

[tool.hatch.build.targets.wheel.force-include]
"src/pytscheck/bin" = "pytscheck/bin"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "docs/", "examples/", "README.md", "LICENSE", "NOTICE.txt"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pytscheck"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"