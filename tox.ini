[tox]
envlist = py{311,312,313}
isolated_build = true

[testenv]
extras = test
commands =
    pytest {posargs}

[testenv:lint]
extras = dev
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts

[testenv:type]
extras = dev
commands =
    mypy src/pytscheck

[testenv:coverage]
extras = test
commands =
    pytest --cov=pytscheck --cov-report=term-missing --cov-report=xml