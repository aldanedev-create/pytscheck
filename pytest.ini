[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    slow: marks tests as slow
    integration: requires the bundled tsgo binary
    windows: Windows-only
    linux: Linux-only
    macos: macOS-only
    network: requires network access
filterwarnings =
    error
    ignore::DeprecationWarning:pytscheck.*